name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev libgdk-pixbuf-2.0-dev
      - name: Build release
        run: cargo build --release --bin libresync-core
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/libresync-core
          generate_release_notes: true
