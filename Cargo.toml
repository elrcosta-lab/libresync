[package]
name = "libresync-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

[features]
integration-test = []

[dev-dependencies]
futures = "0.3"
wiremock = "0.6"
tempfile = "3"
