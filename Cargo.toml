[package]
name = "libresync-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tauri = { version = "2", default-features = false, features = ["tray-icon", "wry", "image-png"] }
toml = "0.8"
directories = "6"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
aes-gcm = "0.10"
hkdf = "0.12"
notify-rust = "4"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
integration-test = []

[dev-dependencies]
futures = "0.3"
wiremock = "0.6"
tempfile = "3"
